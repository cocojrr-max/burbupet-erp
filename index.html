<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4d76bb"><meta name="description" content="Gestión de personal, asistencia y planilla de BURBUPET">
  <title>BURBUPET ERP</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reference.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="mobile.css">

<body>
<div id="toast"></div>
<section id="auth" class="auth-page">

    <img class="brand-logo" src="burbupet-logo.png" alt="Burbupet"><h1>BURBUPET ERP</h1><p>Gestión de personal de Petalia Inversiones</p>

    <button id="signup" class="secondary">Crear mi acceso</button><button id="reset" class="link">Olvidé mi contraseña</button>
    <small>El correo debe estar previamente registrado por el administrador.</small>
  </div>
</section>
<div id="app" class="app hidden">
  <aside><div class="brand"><img src="burbupet-logo.png" alt="Burbupet"><div><b>BURBUPET ERP</b><span>Gestión de personal</span></div></div><div id="role-switch" class="role-switch"><button class="active">Administrador</button><button>Trabajador</button></div><nav id="nav"></nav><div class="profile"><span>JR</span><div><b id="profile-name">Jorge Ramirez</b><small id="profile-role">Administrador</small></div></div><button id="logout" class="logout">Cerrar sesión</button></aside><button id="nav-overlay" aria-label="Cerrar menú"></button>

</div>
